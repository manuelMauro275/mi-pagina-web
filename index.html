<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz día de los carritos Hot Wheels</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#050818;font-family:'Trebuchet MS',Arial,sans-serif;color:#fff}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s;overflow:hidden}
.scene.on{opacity:1;pointer-events:auto}
#s-load{background:radial-gradient(circle,#0a1a4a,#050818)}
.bar{position:relative;width:min(80vw,460px);height:18px;border:2px solid #4fc3ff;border-radius:12px;margin-top:70px;box-shadow:0 0 15px #4fc3ff88}
.fill{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#1e6bff,#7fdcff)}
.car{position:absolute;top:-62px;left:0;transform:translateX(-50%);filter:drop-shadow(0 0 8px #4fc3ff)}
.load-t{font-size:22px;letter-spacing:4px;color:#7fdcff;text-shadow:0 0 12px #4fc3ff}
.flame{font-size:26px;margin-bottom:12px}
#s-bq{background:radial-gradient(circle at 50% 60%,#0d2b6b,#050818 70%)}
h1{font-size:clamp(26px,5.5vw,54px);text-align:center;padding:0 14px;margin-bottom:10px;background:linear-gradient(90deg,#1e6bff,#9fe6ff,#2a8cff,#c4f1ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite;filter:drop-shadow(0 0 10px #4fc3ff) drop-shadow(0 0 22px #1e6bff)}
@keyframes sh{to{background-position:300% 0}}
#bq{width:min(90vw,440px);transition:transform 3.2s ease-in-out;animation:fl 4s ease-in-out infinite}
#bq.away{transform:translateX(-130vw)}
@keyframes fl{50%{translate:0 -8px}}
#go{margin-top:14px;padding:14px 30px;font-size:19px;border:2px solid #9fe6ff;border-radius:40px;background:linear-gradient(135deg,#1e6bff,#4fc3ff);color:#fff;cursor:pointer;box-shadow:0 0 22px #4fc3ffaa;opacity:0;pointer-events:none;transition:opacity 1.5s,transform .2s}
#go.show{opacity:1;pointer-events:auto}
#go:hover{transform:scale(1.07)}
#s-letter{background:rgba(5,8,24,.55);transition:opacity 1s,transform 2.5s ease-in}
#s-letter.out{transform:translateY(-120vh)}
.card{width:min(88vw,420px);padding:26px 22px 34px;text-align:center;background:linear-gradient(160deg,#e01b2f,#a30d1f);border:3px solid #ffd6d6;border-radius:14px;box-shadow:0 0 40px #ff2a4488;transform-origin:top;transform:rotateX(-90deg) scale(.6);opacity:0;transition:transform 1.6s ease,opacity 1s}
.card.open{transform:none;opacity:1}
.te{font-size:clamp(34px,9vw,52px);font-weight:900;letter-spacing:3px;text-shadow:0 3px 0 #6b0512,0 0 18px #ffb300}
.fig{font-size:30px;margin:6px 0 14px}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}.mb{text-align:center}.mb small{display:block;font-size:8px;letter-spacing:1px;margin-top:2px}
.msg{font-size:clamp(19px,4.6vw,25px);line-height:1.4;font-style:italic}
#s-uni{background:#070d30}
canvas{position:absolute;inset:0;touch-action:none;cursor:grab}
#phrase{position:absolute;left:50%;bottom:6vh;transform:translate(-50%,20px);width:min(88vw,520px);padding:18px 24px;text-align:center;font-size:clamp(17px,4.3vw,23px);line-height:1.4;border-radius:18px;background:rgba(10,30,90,.82);border:2px solid #7fdcff;box-shadow:0 0 30px #4fc3ff88;opacity:0;pointer-events:none;transition:.5s}
#phrase.show{opacity:1;transform:translate(-50%,0)}
#cnt,#hint{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:14px;color:#9fe6ff;pointer-events:none;text-shadow:0 0 8px #1e6bff}
#hint{top:38px;opacity:.7;font-size:12px}
#snd{position:fixed;right:12px;bottom:12px;z-index:9;background:#0b1e55cc;color:#9fe6ff;border:1px solid #4fc3ff;border-radius:20px;padding:7px 13px;font-size:13px;cursor:pointer}
</style>
</head>
<body>

<div class="scene on" id="s-load">
  <div class="flame">🏁🏁🏁</div>
  <div class="load-t">CARGANDO...</div>
  <div class="bar"><div class="fill" id="fill"></div><div class="car" id="car"></div></div>
</div>

<div class="scene" id="s-bq">
  <h1>Feliz día de los carritos Hot Wheels</h1>
  <svg id="bq" viewBox="0 0 400 420"></svg>
  <button id="go">Entrar al universo 💙</button>
</div>

<div class="scene" id="s-letter">
  <div class="card" id="card">
    <div class="te">TE AMO</div>
    <div class="row" id="lrow"></div>
    <div class="msg">Cuanto más tiempo estoy contigo, más te amo</div>
    <div class="row" id="lrow2" style="margin-top:12px"></div>
  </div>
</div>

<div class="scene" id="s-uni">
  <canvas id="cv"></canvas>
  <div id="cnt">💫 Motos descubiertas: 0 / 10</div>
  <div id="hint">Arrastra para girar · rueda para acercar · toca cada moto-planeta</div>
  <div id="phrase"></div>
</div>

<button id="snd">🎵 Toca para activar música</button>

ch=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]],
lead=[[440,523.3,659.3],[349.2,440,523.3],[523.3,659.3,784],[392,493.9,587.3]];
function note(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=type==='sawtooth'?2200:3500;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl).connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v,hp){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+d+.02)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.25)}
function rev(t){const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type='sawtooth';f.type='lowpass';f.frequency.value=900;o.frequency.setValueAtTime(60,t);o.frequency.exponentialRampToValueAtTime(320,t+1);o.frequency.exponentialRampToValueAtTime(110,t+1.6);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.13,t+.6);g.gain.exponentialRampToValueAtTime(.001,t+1.7);o.connect(f).connect(g).connect(ac.destination);o.start(t);o.stop(t+1.8)}
function sched(){while(nextT<ac.currentTime+.15){const t=nextT,s=ns%16,bar=(ns/16|0)%4;
  if(s%4===0)kick(t);
  if(s===4||s===12)noise(t,.15,.22,1500);
  if(s%2===0)noise(t,.04,.07,7000);
  if(s%2===0)note(bassR[bar]*(s%8===6?2:1),t,.2,'sawtooth',.12);
  note(ch[bar][[0,1,2,1][s%4]]*(s>=8?2:1),t,.11,'square',.03);
  if(s===0||s===8||s===10)note(lead[bar][s===0?0:s===8?1:2],t,.35,'sawtooth',.045);
  if(ns%128===0)rev(t);
  ns++;nextT+=DUR}}
async function startAudio(){
  try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  await ac.resume();
  if(ac.state==='running'&&!timer){nextT=ac.currentTime+.1;timer=setInterval(sched,25);playing=true;$('snd').textContent='🔊 Música';$('snd').style.opacity=.5}}catch(e){}}
['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,startAudio,{passive:true}));
$('snd').onclick=()=>{if(playing){clearInterval(timer);timer=null;ac.suspend();playing=false;$('snd').textContent='🔇 Música apagada';$('snd').style.opacity=1}else startAudio()};
startAudio();

/* ---------- RAMO ---------- */
(function(){
  const svg=$('bq');let h='';
  const cols=[['#1e6bff','#7fb4ff'],['#8fdcff','#d6f4ff'],['#2a8cff','#a8d4ff'],['#5ccfff','#e3f8ff'],['#0f4fd6','#5b96ff']];
  const pts=[[200,90,42],[130,130,36],[270,130,36],[80,190,32],[320,190,32],[165,185,38],[235,185,38],[200,150,30],[120,245,30],[280,245,30],[200,235,34],[50,255,24],[350,255,24]];
  pts.forEach(p=>h+=`<path d="M${p[0]} ${p[1]} Q${(p[0]+200)/2} 330 200 375" stroke="#2e9b5a" stroke-width="4" fill="none"/>`);
  h+=`<path d="M200 375 L130 300 Q200 330 270 300 Z" fill="#7fdcff" opacity=".85"/><path d="M185 350 L215 350 L225 395 L175 395Z" fill="#1e6bff"/>`;
  pts.forEach((p,i)=>{const c=cols[i%5],n=8;
    for(let k=0;k<n;k++)h+=`<ellipse cx="${p[0]}" cy="${p[1]-p[2]*.55}" rx="${p[2]*.3}" ry="${p[2]*.55}" fill="${c[k%2]}" stroke="#fff" stroke-opacity=".35" transform="rotate(${k*360/n} ${p[0]} ${p[1]})"/>`;
    h+=`<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]*.22}" fill="#fff8c4"/>`});
  svg.innerHTML=h;
})();

/* ---------- SECUENCIA ---------- */
let pct=0;
const ld=setInterval(()=>{pct+=Math.random()*3+.6;if(pct>=100){pct=100;clearInterval(ld);setTimeout(toBouquet,700)}
  $('fill').style.width=pct+'%';$('car').style.left=pct+'%'},90);
function toBouquet(){show('s-load',false);show('s-bq');setTimeout(()=>{
  $('bq').classList.add('away');setTimeout(toLetter,1800)},6500)}
function toLetter(){show('s-letter');setTimeout(()=>$('card').classList.add('open'),400);
  setTimeout(()=>{$('card').classList.remove('open');
    setTimeout(()=>{$('s-letter').classList.add('out');setTimeout(()=>{show('s-letter',false);$('bq').classList.remove('away');
      setTimeout(()=>$('go').classList.add('show'),1500)},2200)},1700)},9000)}
$('go').onclick=()=>{show('s-bq',false);show('s-uni');initUni()};

/* ---------- UNIVERSO DE MOTOS ---------- */
const frases=[
 "Te amo más que a todas las estrellas de esta galaxia juntas. ✨",
 "Mi amor por ti es tan veloz que ninguna moto del mundo lo alcanza. 🏁",
 "Te amo hasta el infinito y un kilómetro más. 💙",
 "Cada día contigo es mi vuelta perfecta, y nunca quiero llegar a la meta. 🏍️",
 "Te amo más de lo que cabe en todo el universo. 🌌",
 "Aunque el camino sea largo, mi destino siempre eres tú. ❤️",
 "Mi corazón acelera a mil solo con verte. 🔥",
 "Te amo tanto que ni el sol azul brilla más que tú. 🌟",
 "Contigo hasta el fin del mundo, sin frenar jamás. 💫",
 "Te amo con todo lo que soy, hoy, mañana y siempre. 💖"];
const cv=$('cv'),ctx=cv.getContext('2d');
const KEY=['yamaha','ducati','kawasaki','honda','suzuki','bmw','ktm','aprilia','triumph','mvagusta'];
const svgImg=[],photo=[];
BR.forEach((b,i)=>{const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(moto(b[1],b[2],240));svgImg[i]=im;
  const ph=new Image();ph.src=PH[i];photo[i]=ph});
let W,H,yaw=.6,pitch=.55,zoom=1,planets=[],stars=[],sel=-1,seen=new Set(),ready=false,pd=null,moved=0,hover=-1,tm,hits=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',rs);
function initUni(){
  if(ready)return;ready=true;rs();
  for(let i=0;i<10;i++)planets.push({a:120+i*40,ang:Math.random()*6.28,spd:.0032/(1+i*.3),w:(100+Math.random()*16)*Math.sqrt(.62/ASP[i]),tilt:(Math.random()-.5)*.25});
  for(let i=0;i<650;i++){const u=Math.random()*6.28,v=Math.acos(2*Math.random()-1),d=900+Math.random()*900;
    stars.push([d*Math.sin(v)*Math.cos(u),d*Math.cos(v),d*Math.sin(v)*Math.sin(u),Math.random()*1.8+.5,Math.random()*6,Math.random()<.3])}
  loop()}
function pj(x,y,z){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const x1=x*cy-z*sy,z1=x*sy+z*cy,y1=y*cp-z1*sp,z2=y*sp+z1*cp;
  const s=Math.max(.05,700/(700+z2))*zoom;return{x:W/2+x1*s,y:H/2+y1*s,s,z:z2}}
function pos(p){return[Math.cos(p.ang)*p.a,Math.sin(p.ang)*p.a*p.tilt,Math.sin(p.ang)*p.a]}
function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill()}
function loop(){
  const T=performance.now();
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#070d30';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  glow(W*.2,H*.25,W*.5,'60,90,255',.28);glow(W*.85,H*.7,W*.5,'0,200,255',.22);glow(W*.5,H*.95,W*.45,'150,80,255',.2);
  stars.forEach(s=>{const q=pj(s[0],s[1],s[2]);ctx.globalAlpha=.55+.45*Math.sin(T*.003+s[4]);ctx.fillStyle=s[5]?'#9fe6ff':'#fff';ctx.fillRect(q.x,q.y,s[3],s[3])});ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(150,225,255,.3)';ctx.lineWidth=1.2;
  planets.forEach(p=>{ctx.beginPath();for(let k=0;k<=72;k++){const a=k/72*6.28,q=pj(Math.cos(a)*p.a,Math.sin(a)*p.a*p.tilt,Math.sin(a)*p.a);k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)}ctx.stroke()});
  const items=[{sun:1,...pj(0,0,0)}];
  planets.forEach((p,i)=>{if(sel!==i)p.ang+=p.spd;items.push({i,p,...pj(...pos(p))})});
  items.sort((a,b)=>b.z-a.z);
  hits=[];
  items.forEach(o=>{
    if(o.sun){const r=46*o.s,pu=1+.05*Math.sin(T*.004);
      ctx.globalCompositeOperation='lighter';
      glow(o.x,o.y,r*5*pu,'40,140,255',.5);glow(o.x,o.y,r*2.4*pu,'120,215,255',.75);
      ctx.globalCompositeOperation='source-over';
      const g=ctx.createRadialGradient(o.x-r*.25,o.y-r*.25,r*.1,o.x,o.y,r);
      g.addColorStop(0,'#fff');g.addColorStop(.35,'#b5ecff');g.addColorStop(1,'#2a9bff');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(o.x,o.y,r,0,6.28);ctx.fill();return}
    const b=BR[o.i],w=o.p.w*o.s,h=w*ASP[o.i],c=b[1]==='#161616'||b[1]==='#f4f4f4'?b[2]:b[1];
    const hex=c.replace('#',''),rgb=[0,2,4].map(k=>parseInt(hex.substr(k,2),16)).join(',');
    ctx.globalCompositeOperation='lighter';glow(o.x,o.y,w*.75,rgb,sel===o.i||hover===o.i?.75:.45);
    ctx.globalCompositeOperation='source-over';
    const im=photo[o.i];
    if(im.complete&&im.naturalWidth>0){ctx.shadowColor=`rgb(${rgb})`;ctx.shadowBlur=14;ctx.drawImage(im,o.x-w/2,o.y-h/2,w,h);ctx.shadowBlur=0}
    if(sel===o.i||hover===o.i){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(o.x,o.y,w*.5,h*.62,0,0,6.28);ctx.stroke()}
    hits.push({i:o.i,x:o.x,y:o.y,hw:w*.46,hh:h*.5})});
  hits.reverse();
  requestAnimationFrame(loop)}
function pick(x,y){for(const o of hits){const dx=(x-o.x)/o.hw,dy=(y-o.y)/o.hh;if(dx*dx+dy*dy<=1)return o.i}return -1}
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY};moved=0;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
  if(pd){const dx=e.clientX-pd.x,dy=e.clientY-pd.y;moved+=Math.abs(dx)+Math.abs(dy);
    yaw+=dx*.006;pitch=Math.max(-1.5,Math.min(1.5,pitch+dy*.006));pd={x:e.clientX,y:e.clientY}}
  else{hover=pick(e.clientX,e.clientY);cv.style.cursor=hover>=0?'pointer':'grab'}});
cv.addEventListener('pointerup',e=>{cv.style.cursor='grab';
  if(pd&&moved<6){const i=pick(e.clientX,e.clientY);
    if(i>=0){sel=i;seen.add(i);$('phrase').innerHTML=`<b style="color:#9fe6ff;letter-spacing:2px">🏍️ ${BR[i][0]}</b><br>${frases[i]}`;$('phrase').classList.add('show');
      $('cnt').textContent=`💫 Motos descubiertas: ${seen.size} / 10`+(seen.size===10?' — ¡las descubriste todas! 💙':'');
      clearTimeout(tm);tm=setTimeout(closeP,9000)}
    else closeP()}
  pd=null});
function closeP(){sel=-1;$('phrase').classList.remove('show')}
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.5,zoom*(e.deltaY<0?1.08:.92)))},{passive:false});
</script>
